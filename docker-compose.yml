services:
  # ===== FastAPI =====
  fastapi:
    container_name: fastapi
    build:
      # 빌드 컨텍스트: 프로젝트 루트 (app/, worker/, static/, alembic/을 모두 이미지에 넣기 위해)
      context: .
      dockerfile: app/Dockerfile
    env_file:
      - .env
    environment:
      # 컨테이너 안에서 localhost는 자기 자신이다 → DB는 서비스 이름(mysql)으로 찾는다
      DB_HOST: mysql
      DB_PORT: "3306"
      # Windows·macOS에서 마운트한 파일의 변경을 감지하도록 폴링 방식 사용
      WATCHFILES_FORCE_POLLING: "true"
    # 1) DB 테이블을 최신 마이그레이션까지 만들고 2) --reload로 개발 서버 실행
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --reload-dir worker"
    ports:
      # 왼쪽: 내 컴퓨터 포트(.env의 APP_PORT, 없으면 8000) / 오른쪽: 컨테이너 포트
      - "${APP_PORT:-8000}:8000"
    volumes:
      # 로컬 프로젝트 폴더를 컨테이너 /app에 연결 → 코드를 고치면 즉시 반영
      - .:/app
    healthcheck:
      # slim 이미지에는 curl이 없어서 파이썬으로 /healthcheck를 호출한다
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      # MySQL이 접속 가능한 상태(healthy)가 된 뒤에 시작
      mysql:
        condition: service_healthy
    # DB 접속 실패 등으로 꺼지면 자동으로 다시 시작
    restart: on-failure

  # ===== MySQL =====
  mysql:
    container_name: mysql
    image: mysql:8.0
    environment:
      # 컨테이너 전용 DB 계정 (내 컴퓨터에 설치한 MySQL과는 별개)
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      # 내 컴퓨터에 MySQL(3306)이 이미 있으면 충돌하므로 3307로 연결 (Workbench 접속용)
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      # 컨테이너를 지워도 DB 데이터가 남도록 이름 있는 볼륨에 저장
      - mysql_volume:/var/lib/mysql
    healthcheck:
      # -h 127.0.0.1: 소켓이 아니라 TCP로 확인한다
      # (MySQL 컨테이너는 처음 켜질 때 네트워크를 끈 임시 서버로 초기화를 하는데,
      #  localhost(소켓)로 확인하면 그 임시 서버에도 "살아 있음"이 떠서 fastapi가 너무 일찍 접속한다)
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_volume:
