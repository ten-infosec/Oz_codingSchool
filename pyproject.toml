[project]
name = "ai-health-web-assignment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "asyncmy>=0.2.11",
    "cryptography>=46.0.6",
    "fastapi[standard]>=0.135.3",
    "pillow>=13.0.0",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.0.49",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "uuid6>=2025.0.1",
]

# ===== PyTorch CPU wheels (Docker / Linux) =====
# PyPI의 리눅스용 torch는 GPU(CUDA) 라이브러리까지 받아 이미지가 수 GB가 된다
# 리눅스(도커 컨테이너)에서만 CPU 전용 인덱스를 쓰고, Windows·macOS는 지금처럼 PyPI를 쓴다
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
